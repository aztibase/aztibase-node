<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aztibase Explorer</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }

header {
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}
.logo {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.logo span { color: var(--accent); }
.chain-info {
  display: flex;
  gap: 16px;
  font-size: 13px;
  color: var(--muted);
}
.chain-info .val { color: var(--text); font-family: var(--mono); font-size: 12px; }

.search-bar {
  flex: 1;
  min-width: 280px;
  display: flex;
  gap: 8px;
}
.search-bar input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 14px;
  font-family: var(--mono);
  outline: none;
}
.search-bar input:focus { border-color: var(--accent); }
.search-bar button {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 6px;
  padding: 8px 16px;
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
}

main { max-width: 1100px; margin: 0 auto; padding: 24px; }

.view-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.view-title .badge {
  font-size: 12px;
  background: var(--accent);
  color: #000;
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: 600;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 12px;
  overflow: hidden;
}
.card-row {
  display: flex;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
  font-size: 14px;
}
.card-row:last-child { border-bottom: none; }
.card-label {
  color: var(--muted);
  min-width: 120px;
  flex-shrink: 0;
  font-size: 13px;
}
.card-value {
  font-family: var(--mono);
  font-size: 13px;
  word-break: break-all;
}

.block-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 12px;
}
.block-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.block-card:hover { border-color: var(--accent); }
.block-num {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 8px;
}
.block-meta {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  gap: 16px;
}
.block-hash {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  margin-top: 8px;
  word-break: break-all;
}

.tx-row {
  display: flex;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  gap: 12px;
  font-size: 13px;
}
.tx-row:last-child { border-bottom: none; }
.tx-hash {
  font-family: var(--mono);
  font-size: 12px;
  flex: 1;
  word-break: break-all;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.status-dot.ok { background: var(--green); }
.status-dot.err { background: var(--red); }
.status-dot.pending { background: var(--muted); }

.empty-state {
  text-align: center;
  padding: 48px;
  color: var(--muted);
  font-size: 14px;
}

.nav-link {
  font-size: 13px;
  margin-bottom: 16px;
  display: inline-block;
}

.account-bal {
  font-size: 24px;
  font-weight: 700;
  margin: 8px 0;
}

@media (max-width: 640px) {
  header { padding: 12px 16px; }
  main { padding: 16px; }
  .block-grid { grid-template-columns: 1fr; }
  .card-row { flex-direction: column; gap: 4px; }
  .card-label { min-width: auto; }
}
</style>
</head>
<body>

<header>
  <div class="logo">Aztibase <span>Explorer</span></div>
  <div class="chain-info">
    <div>Chain: <span class="val" id="hdr-chain">--</span></div>
    <div>Height: <span class="val" id="hdr-height">--</span></div>
    <div><span class="status-dot" id="hdr-status"></span></div>
  </div>
  <div class="search-bar">
    <input id="search-input" placeholder="Block number, tx hash, or address (0x...)" />
    <button onclick="doSearch()">Search</button>
  </div>
</header>

<main id="content">
  <div class="empty-state">Connecting to node...</div>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const RPC_URL = params.get('rpc') || 'http://localhost:9944';
let pollTimer = null;

async function rpc(method, rpcParams = []) {
  const res = await fetch(RPC_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', method, params: rpcParams, id: 1 }),
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));
  return json.result;
}

function shortHash(h) {
  if (!h || h.length < 16) return h || '--';
  return h.slice(0, 10) + '...' + h.slice(-8);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- Views ---

async function showLatestBlocks() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="view-title">Latest Blocks <span class="badge">live</span></div><div class="block-grid" id="block-grid"><div class="empty-state">Loading...</div></div>';

  try {
    const height = await rpc('aztb_blockNumber');
    const h = typeof height === 'string' ? parseInt(height, 16) : (height || 0);
    document.getElementById('hdr-height').textContent = h;
    document.getElementById('hdr-status').className = 'status-dot ok';

    if (h === 0) {
      document.getElementById('block-grid').innerHTML = '<div class="empty-state">No blocks yet</div>';
      return;
    }

    const from = Math.max(0, h - 19);
    const blocks = await rpc('aztb_getBlockRange', [from, h]);
    const grid = document.getElementById('block-grid');

    if (!blocks || blocks.length === 0) {
      grid.innerHTML = '<div class="empty-state">No blocks in range</div>';
      return;
    }

    grid.innerHTML = blocks.reverse().map(b => {
      const num = typeof b.number === 'string' ? parseInt(b.number, 16) : b.number;
      const txCount = b.transactions ? b.transactions.length : (b.tx_count || 0);
      const hash = b.hash || '--';
      return `<div class="block-card" onclick="showBlock(${num})">
        <div class="block-num">Block #${num}</div>
        <div class="block-meta">
          <span>${txCount} tx${txCount !== 1 ? 's' : ''}</span>
        </div>
        <div class="block-hash">${escapeHtml(hash)}</div>
      </div>`;
    }).join('');
  } catch (e) {
    el.innerHTML = `<div class="empty-state">Failed to connect to node at ${escapeHtml(RPC_URL)}<br><br>${escapeHtml(e.message)}<br><br>Use ?rpc=http://host:port to set endpoint</div>`;
    document.getElementById('hdr-status').className = 'status-dot err';
  }
}

async function showBlock(num) {
  stopPolling();
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty-state">Loading block...</div>';

  try {
    const block = await rpc('aztb_getBlockByNumber', [num]);
    if (!block) {
      el.innerHTML = `<a class="nav-link" onclick="startPolling()">Back to latest</a><div class="empty-state">Block #${num} not found</div>`;
      return;
    }

    const txs = block.transactions || [];
    const hash = block.hash || '--';
    const stateRoot = block.stateRoot || block.state_root || '--';

    el.innerHTML = `
      <a class="nav-link" onclick="startPolling()">Back to latest</a>
      <div class="view-title">Block #${num}</div>
      <div class="card">
        <div class="card-row"><div class="card-label">Hash</div><div class="card-value">${escapeHtml(hash)}</div></div>
        <div class="card-row"><div class="card-label">Height</div><div class="card-value">${num}</div></div>
        <div class="card-row"><div class="card-label">Transactions</div><div class="card-value">${txs.length}</div></div>
        <div class="card-row"><div class="card-label">State Root</div><div class="card-value">${escapeHtml(stateRoot)}</div></div>
      </div>
      ${txs.length > 0 ? `
        <div class="view-title" style="margin-top:24px">Transactions</div>
        <div class="card">
          ${txs.map((tx, i) => `<div class="tx-row">
            <span style="color:var(--muted)">${i}</span>
            <a class="tx-hash" onclick="showTx('${escapeHtml(tx)}')">${escapeHtml(tx)}</a>
          </div>`).join('')}
        </div>` : ''}
    `;
  } catch (e) {
    el.innerHTML = `<a class="nav-link" onclick="startPolling()">Back to latest</a><div class="empty-state">Error: ${escapeHtml(e.message)}</div>`;
  }
}

async function showTx(hash) {
  stopPolling();
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty-state">Loading transaction...</div>';

  try {
    const tx = await rpc('aztb_getTransactionByHash', [hash]);
    if (!tx) {
      el.innerHTML = `<a class="nav-link" onclick="startPolling()">Back to latest</a><div class="empty-state">Transaction not found</div>`;
      return;
    }

    const fields = Object.entries(tx).filter(([k]) => k !== 'hash');
    el.innerHTML = `
      <a class="nav-link" onclick="startPolling()">Back to latest</a>
      <div class="view-title">Transaction</div>
      <div class="card">
        <div class="card-row"><div class="card-label">Hash</div><div class="card-value">${escapeHtml(hash)}</div></div>
        ${fields.map(([k, v]) => `<div class="card-row">
          <div class="card-label">${escapeHtml(k)}</div>
          <div class="card-value">${typeof v === 'object' ? escapeHtml(JSON.stringify(v)) : isAddr(v) ? `<a onclick="showAccount('${escapeHtml(String(v))}')">${escapeHtml(String(v))}</a>` : escapeHtml(String(v))}</div>
        </div>`).join('')}
      </div>
    `;
  } catch (e) {
    el.innerHTML = `<a class="nav-link" onclick="startPolling()">Back to latest</a><div class="empty-state">Error: ${escapeHtml(e.message)}</div>`;
  }
}

async function showAccount(addr) {
  stopPolling();
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty-state">Loading account...</div>';

  try {
    const [balance, nonce, accType] = await Promise.all([
      rpc('aztb_getBalance', [addr]).catch(() => '0'),
      rpc('aztb_getNonce', [addr]).catch(() => '0'),
      rpc('aztb_getAccountType', [addr]).catch(() => 'Unknown'),
    ]);

    const bal = typeof balance === 'string' ? balance : String(balance || 0);

    el.innerHTML = `
      <a class="nav-link" onclick="startPolling()">Back to latest</a>
      <div class="view-title">Account</div>
      <div class="card">
        <div class="card-row"><div class="card-label">Address</div><div class="card-value">${escapeHtml(addr)}</div></div>
        <div class="card-row"><div class="card-label">Balance</div><div class="card-value">${escapeHtml(bal)} base units</div></div>
        <div class="card-row"><div class="card-label">Nonce</div><div class="card-value">${escapeHtml(String(nonce))}</div></div>
        <div class="card-row"><div class="card-label">Type</div><div class="card-value">${escapeHtml(String(accType))}</div></div>
      </div>
    `;
  } catch (e) {
    el.innerHTML = `<a class="nav-link" onclick="startPolling()">Back to latest</a><div class="empty-state">Error: ${escapeHtml(e.message)}</div>`;
  }
}

function isAddr(v) {
  return typeof v === 'string' && /^(0x)?[0-9a-fA-F]{64}$/.test(v);
}

function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;

  if (/^\d+$/.test(q)) {
    showBlock(parseInt(q, 10));
  } else if (/^0x[0-9a-fA-F]+$/.test(q) || /^[0-9a-fA-F]{64}$/.test(q)) {
    if (q.replace('0x', '').length === 64) {
      showTx(q).catch(() => showAccount(q));
    } else {
      showBlock(parseInt(q, 16));
    }
  } else {
    showAccount(q);
  }
}

document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

function startPolling() {
  showLatestBlocks();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(showLatestBlocks, 3000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

(async () => {
  try {
    const chainId = await rpc('aztb_chainId');
    document.getElementById('hdr-chain').textContent = chainId || '--';
  } catch (_) {}
  startPolling();
})();
</script>
</body>
</html>
