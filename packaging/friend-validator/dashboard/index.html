<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aztibase Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl-fast.min.js"></script>
<style>
:root {
  --bg-primary: #121016;
  --bg-secondary: #0e0c12;
  --bg-card: #1a1720;
  --bg-card-hover: #22202a;
  --bg-input: #22202a;
  --border: #2e2a38;
  --border-light: #38344a;
  --text: #e8e4ec;
  --text-secondary: rgba(232,228,236,0.72);
  --text-muted: rgba(232,228,236,0.42);
  --accent: #8878a6;
  --accent-hover: #a494c0;
  --accent-soft: rgba(136,120,166,0.12);
  --accent-glow: rgba(136,120,166,0.30);
  --gold: #b8a67e;
  --gold-soft: rgba(184,166,126,0.12);
  --green: #5db88a;
  --green-soft: rgba(93,184,138,0.12);
  --green-text: #88c0b6;
  --red: #c9927e;
  --red-soft: rgba(201,146,126,0.12);
  --yellow: #b8a67e;
  --yellow-soft: rgba(184,166,126,0.12);
  --cyan: #6ba89e;
  --cyan-soft: rgba(107,168,158,0.12);
  --purple: #8878a6;
  --purple-soft: rgba(136,120,166,0.12);
  --orange: #deae9c;
  --orange-soft: rgba(222,174,156,0.12);
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --shadow: 0 2px 8px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.6);
  --radius: 12px;
  --radius-sm: 8px;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--sans);
  background: var(--bg-primary);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { color: var(--accent-hover); }
code, .mono { font-family: var(--mono); }
::selection { background: var(--accent-glow); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

/* ── Header ─────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center;
  padding: 0 24px; height: 56px;
  background: rgba(14,12,18,0.88);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  gap: 20px;
}
.logo {
  font-size: 18px; font-weight: 800;
  letter-spacing: -0.03em; color: var(--text);
  white-space: nowrap; display: flex; align-items: center; gap: 8px;
}
.logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
.logo em { font-style: normal; color: var(--text-secondary); font-weight: 500; font-size: 13px; }

nav.tabs { display: flex; gap: 2px; }
nav.tabs button {
  background: none; border: none;
  padding: 7px 14px; font-size: 13px; font-weight: 600;
  color: var(--text-muted); cursor: pointer;
  border-radius: 8px; font-family: var(--sans);
  transition: all 0.15s;
}
nav.tabs button:hover { color: var(--text-secondary); background: rgba(255,255,255,0.04); }
nav.tabs button.active {
  color: #fff; background: var(--accent);
  box-shadow: 0 2px 12px var(--accent-glow);
}

.hdr-right {
  margin-left: auto; display: flex;
  align-items: center; gap: 16px;
  font-size: 12px; color: var(--text-muted); font-weight: 500;
}
.hdr-right code { font-family: var(--mono); color: var(--text-secondary); font-size: 11px; }
.hdr-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-card); padding: 4px 10px;
  border-radius: 20px; border: 1px solid var(--border);
  font-size: 11px; font-weight: 600;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  display: inline-block; flex-shrink: 0;
}
.status-dot.ok { background: var(--green); box-shadow: 0 0 8px rgba(64,192,87,0.5); }
.status-dot.err { background: var(--red); }
.status-dot.pending { background: var(--text-muted); }

/* ── Search ─────────────────────────────────────── */
.search-wrap {
  padding: 20px 24px 0;
  max-width: 1280px; margin: 0 auto;
}
.search-bar {
  display: flex; gap: 0;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: border-color 0.2s;
}
.search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.search-bar input {
  flex: 1;
  padding: 12px 18px; font-size: 13px;
  font-family: var(--mono); font-weight: 400;
  color: var(--text); background: transparent;
  border: none; outline: none;
}
.search-bar input::placeholder { color: var(--text-muted); }
.search-bar button {
  padding: 0 24px; font-size: 13px; font-weight: 700;
  font-family: var(--sans);
  color: #fff; background: var(--accent);
  border: none; cursor: pointer;
  transition: background 0.15s;
}
.search-bar button:hover { background: var(--accent-hover); }

/* ── Main ────────────────────────────────────────── */
main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 40px; }

/* ── Stat cards ──────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow);
  transition: transform 0.15s, border-color 0.15s;
  position: relative; overflow: hidden;
}
.stat-card:hover { transform: translateY(-2px); border-color: var(--border-light); }
.stat-card .icon {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; margin-bottom: 10px;
}
.stat-card .icon.blue { background: var(--accent-soft); color: var(--accent); }
.stat-card .icon.green { background: var(--green-soft); color: var(--green); }
.stat-card .icon.purple { background: var(--purple-soft); color: var(--purple); }
.stat-card .icon.cyan { background: var(--cyan-soft); color: var(--cyan); }
.stat-card .icon.orange { background: var(--orange-soft); color: var(--orange); }
.stat-card .icon.red { background: var(--red-soft); color: var(--red); }
.stat-card .val {
  font-size: 22px; font-weight: 800; color: var(--text);
  line-height: 1.2; font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.stat-card .label {
  font-size: 11px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-top: 4px; font-weight: 600;
}
.stat-card .sub {
  font-size: 11px; color: var(--text-muted);
  margin-top: 2px; font-family: var(--mono);
}

/* ── Section titles ──────────────────────────────── */
.section-hdr {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.section-title {
  font-size: 15px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); animation: pulse 2s infinite;
  display: inline-block;
}
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

/* ── Cards ────────────────────────────────────────── */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow);
}
.card-row {
  display: flex; align-items: center;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  gap: 12px; font-size: 13px;
  transition: background 0.1s; cursor: pointer;
}
.card-row:last-child { border-bottom: none; }
.card-row:hover { background: var(--bg-card-hover); }
.card-label {
  color: var(--text-muted); min-width: 140px;
  flex-shrink: 0; font-size: 12px; font-weight: 600;
}
.card-value { font-size: 13px; word-break: break-all; font-variant-numeric: tabular-nums; color: var(--text); }

/* ── Two-col layout ──────────────────────────────── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

/* ── Chart containers ────────────────────────────── */
.chart-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px;
  box-shadow: var(--shadow); margin-bottom: 24px;
}
.chart-card .chart-title {
  font-size: 13px; font-weight: 700;
  color: var(--text-secondary); margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.chart-row .chart-card { margin-bottom: 0; }

/* ── Tables ───────────────────────────────────────── */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  text-align: left; padding: 10px 16px;
  background: var(--bg-secondary); border-bottom: 1px solid var(--border);
  color: var(--text-muted); font-size: 11px;
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em;
}
.data-table td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 12.5px; font-variant-numeric: tabular-nums;
  color: var(--text-secondary);
}
.data-table tr:hover td { background: var(--bg-card-hover); }
.data-table tbody tr { cursor: pointer; }

/* ── Badges ───────────────────────────────────────── */
.badge {
  display: inline-block; padding: 3px 8px;
  border-radius: 6px; font-size: 10px;
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.3px; font-family: var(--sans);
  white-space: nowrap;
}
.badge.transfer { background: rgba(136,120,166,0.15); color: #a494c0; }
.badge.contract { background: var(--purple-soft); color: #b197fc; }
.badge.ai { background: var(--orange-soft); color: #ffa94d; }
.badge.governance { background: var(--green-soft); color: var(--green-text); }
.badge.staking { background: var(--cyan-soft); color: #66d9e8; }
.badge.bridge { background: var(--yellow-soft); color: var(--yellow); }
.badge.security { background: var(--red-soft); color: var(--red); }
.badge.unknown { background: rgba(107,112,148,0.15); color: var(--text-muted); }

/* ── Status ───────────────────────────────────────── */
.status-ok { color: var(--green-text); font-weight: 600; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.status-ok::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.status-fail { color: var(--red); font-weight: 600; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.status-fail::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--red); }

/* ── Direction badges ─────────────────────────────── */
.dir-in { background: var(--green-soft); color: var(--green-text); padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
.dir-out { background: var(--orange-soft); color: var(--orange); padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }

/* ── Copy button ──────────────────────────────────── */
.copy-btn {
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-muted);
  width: 22px; height: 22px; border-radius: 4px;
  font-size: 12px; margin-left: 4px;
  transition: all 0.12s; vertical-align: middle;
  background: transparent; border: none;
}
.copy-btn:hover { color: var(--accent); background: var(--accent-soft); }
.copy-btn.copied { color: var(--green); }

/* ── Tooltips ─────────────────────────────────────── */
[data-tooltip] { position: relative; cursor: help; border-bottom: 1px dotted var(--text-muted); }
[data-tooltip]:hover::after {
  content: attr(data-tooltip);
  position: absolute; bottom: calc(100% + 6px); left: 50%;
  transform: translateX(-50%);
  background: var(--text); color: var(--bg-primary);
  padding: 5px 10px; border-radius: 6px;
  font-size: 11px; font-weight: 500;
  white-space: nowrap; z-index: 100;
  box-shadow: var(--shadow-md); pointer-events: none;
}

/* ── Progress bar ─────────────────────────────────── */
.progress-bar {
  height: 6px; background: var(--border);
  border-radius: 3px; overflow: hidden;
  display: inline-block; width: 100%;
}
.progress-bar .fill {
  height: 100%; border-radius: 3px;
  transition: width 0.3s;
}

/* ── Buttons ──────────────────────────────────────── */
.btn {
  padding: 8px 16px; border: none; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: var(--sans);
  transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { opacity: 0.88; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 12px var(--accent-glow); }
.btn-green { background: var(--green); color: #fff; }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-red { background: var(--red); color: #fff; }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

/* ── Wallet ───────────────────────────────────────── */
.wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.wallet-section { margin-bottom: 20px; }
.wallet-section h3 {
  font-size: 11px; font-weight: 700;
  margin-bottom: 10px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.06em;
}
.wallet-input {
  width: 100%;
  background: var(--bg-input); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 14px;
  color: var(--text); font-family: var(--mono);
  font-size: 12.5px; outline: none; margin-bottom: 8px;
}
.wallet-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.wallet-input::placeholder { color: var(--text-muted); }
.wallet-alert {
  padding: 10px 14px; border-radius: var(--radius-sm);
  font-size: 12px; font-family: var(--mono);
  word-break: break-all; margin-top: 10px;
}
.wallet-alert.success { background: var(--green-soft); border: 1px solid rgba(64,192,87,0.3); color: var(--green-text); }
.wallet-alert.error { background: var(--red-soft); border: 1px solid rgba(255,107,107,0.3); color: var(--red); }
.wallet-alert.info { background: var(--accent-soft); border: 1px solid rgba(92,124,250,0.3); color: var(--accent); }
.wallet-alert.warn { background: var(--yellow-soft); border: 1px solid rgba(252,196,25,0.3); color: var(--yellow); }
.secret-toggle { font-size: 11px; color: var(--accent); cursor: pointer; margin-left: 8px; font-weight: 600; }

/* ── Connect gate ─────────────────────────────────── */
.connect-gate {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 60vh; text-align: center; gap: 16px;
}
.connect-gate .logo-big { font-size: 32px; font-weight: 800; letter-spacing: -1px; display: flex; align-items: center; gap: 12px; }
.connect-gate .logo-big .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
.connect-gate .logo-big em { font-style: normal; color: var(--text-secondary); font-weight: 500; font-size: 18px; }
.connect-gate .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 4px; }
.connect-gate .rpc-form { display: flex; gap: 0; width: 100%; max-width: 460px; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.connect-gate .rpc-form input {
  flex: 1; background: transparent;
  border: none; padding: 12px 16px; color: var(--text);
  font-family: var(--mono); font-size: 13px; outline: none;
}
.connect-gate .rpc-form button {
  background: var(--accent); color: #fff; border: none;
  padding: 12px 24px; font-weight: 700;
  font-size: 13px; cursor: pointer; font-family: var(--sans);
}
.connect-gate .status-msg { font-size: 13px; min-height: 20px; font-weight: 500; }
.connect-gate .status-msg.err { color: var(--red); }
.connect-gate .status-msg.ok { color: var(--green-text); }
.connect-gate .status-msg.trying { color: var(--yellow); }

/* ── Nav link ─────────────────────────────────────── */
.nav-link {
  font-size: 12px; font-weight: 600;
  margin-bottom: 14px; display: inline-flex;
  align-items: center; gap: 4px;
}
.nav-link::before { content: '\2190'; }

/* ── Sentinel health ──────────────────────────────── */
.health-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.health-bar .fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.health-bar .fill.normal { background: var(--green); }
.health-bar .fill.warning { background: var(--yellow); }
.health-bar .fill.critical { background: var(--red); }

/* ── Collapsible ──────────────────────────────────── */
.collapsible-toggle {
  font-size: 12px; font-weight: 600;
  color: var(--accent); cursor: pointer;
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
  transition: background 0.1s;
}
.collapsible-toggle:hover { background: var(--accent-soft); }
.collapsible-toggle .arrow { transition: transform 0.2s; display: inline-block; }
.collapsible-toggle.open .arrow { transform: rotate(90deg); }
.collapsible-body { display: none; }
.collapsible-body.open { display: block; }

/* ── Block list ───────────────────────────────────── */
.block-row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s; cursor: pointer;
}
.block-row:last-child { border-bottom: none; }
.block-row:hover { background: var(--bg-card-hover); }
.block-icon {
  width: 36px; height: 36px; border-radius: 8px;
  background: var(--accent-soft); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; flex-shrink: 0;
}
.block-info { flex: 1; min-width: 0; }
.block-num { font-size: 13px; font-weight: 700; color: var(--accent); font-family: var(--mono); }
.block-hash { font-size: 11px; color: var(--text-muted); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.block-meta-right { text-align: right; flex-shrink: 0; }
.block-txcount { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.block-age { font-size: 11px; color: var(--text-muted); }

/* ── Empty state ──────────────────────────────────── */
.empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px; }

/* ── Toast ────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--bg-card); color: var(--text); border: 1px solid var(--border);
  padding: 12px 20px; border-radius: var(--radius);
  font-size: 13px; font-weight: 600;
  box-shadow: var(--shadow-lg); z-index: 9999;
  opacity: 0; transition: opacity 0.3s;
}

/* ── Footer ───────────────────────────────────────── */
footer {
  border-top: 1px solid var(--border);
  padding: 20px 28px; text-align: center;
  font-size: 12px; color: var(--text-muted);
  background: var(--bg-secondary); font-weight: 500;
}
footer a { color: var(--accent); font-weight: 600; }

/* ── Responsive ───────────────────────────────────── */
@media (max-width: 768px) {
  header { padding: 0 16px; gap: 10px; }
  .search-wrap { padding: 14px 16px 0; }
  main { padding: 14px 16px 28px; }
  .two-col, .chart-row { grid-template-columns: 1fr; }
  .wallet-grid { grid-template-columns: 1fr; }
  .card-row { flex-direction: column; gap: 4px; }
  .card-label { min-width: auto; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .hdr-right { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="dot"></span>Aztibase <em id="app-title">Explorer</em></div>
  <nav class="tabs">
    <button id="tab-dashboard" class="active" onclick="navigate('dashboard')">Dashboard</button>
    <button id="tab-blocks" onclick="navigate('blocks')">Blocks</button>
    <button id="tab-transactions" onclick="navigate('transactions')">Transactions</button>
    <button id="tab-validators" onclick="navigate('validators')">Validators</button>
    <button id="tab-wallet" onclick="navigate('wallet')" style="display:none">Wallet</button>
  </nav>
  <div class="hdr-right">
    <div class="hdr-pill"><span>Chain</span> <code id="hdr-chain">--</code></div>
    <div class="hdr-pill"><span>Height</span> <code id="hdr-height">--</code></div>
    <div class="hdr-pill"><span class="status-dot" id="hdr-status"></span> <span id="hdr-conn-text">--</span></div>
  </div>
</header>

  <div class="search-bar">

// ── BLAKE3 (pure JS, single-chunk) ─────────────────────────────────
const BLAKE3 = (() => {
  const IV = [0x6A09E667,0xBB67AE85,0x3C6EF372,0xA54FF53A,0x510E527F,0x9B05688C,0x1F83D9AB,0x5BE0CD19];
  const PERM = [2,6,3,10,7,0,4,13,1,11,12,5,9,14,15,8];
  const CHUNK_START = 1, CHUNK_END = 2, ROOT = 8;
  function rotr(x, n) { return ((x >>> n) | (x << (32 - n))) >>> 0; }
  function g(s, a, b, c, d, mx, my) {
    s[a] = (s[a] + s[b] + mx) >>> 0; s[d] = rotr(s[d] ^ s[a], 16);
    s[c] = (s[c] + s[d]) >>> 0;       s[b] = rotr(s[b] ^ s[c], 12);
    s[a] = (s[a] + s[b] + my) >>> 0; s[d] = rotr(s[d] ^ s[a], 8);
    s[c] = (s[c] + s[d]) >>> 0;       s[b] = rotr(s[b] ^ s[c], 7);
  }
  function compress(cv, block, counter, blockLen, flags) {
    const s = [cv[0],cv[1],cv[2],cv[3],cv[4],cv[5],cv[6],cv[7],
      IV[0],IV[1],IV[2],IV[3],
      counter & 0xFFFFFFFF, (counter / 0x100000000) >>> 0, blockLen, flags];
    let m = block.slice();
    for (let r = 0; r < 7; r++) {
      g(s,0,4,8,12,m[0],m[1]);  g(s,1,5,9,13,m[2],m[3]);
      g(s,2,6,10,14,m[4],m[5]); g(s,3,7,11,15,m[6],m[7]);
      g(s,0,5,10,15,m[8],m[9]); g(s,1,6,11,12,m[10],m[11]);
      g(s,2,7,8,13,m[12],m[13]);g(s,3,4,9,14,m[14],m[15]);
      const p = new Array(16);
      for (let i = 0; i < 16; i++) p[i] = m[PERM[i]];
      m = p;
    }
    for (let i = 0; i < 8; i++) { s[i] ^= s[i+8]; s[i+8] ^= cv[i]; }
    return s;
  }
  function hash(input) {
    const data = input instanceof Uint8Array ? input : new TextEncoder().encode(input);
    let cv = IV.slice();
    const numBlocks = Math.max(1, Math.ceil(data.length / 64));
    for (let i = 0; i < numBlocks; i++) {
      const blk = new Uint8Array(64);
      const off = i * 64, rem = Math.min(64, data.length - off);
      if (rem > 0) blk.set(data.subarray(off, off + rem));
      const w = new Array(16);
      const dv = new DataView(blk.buffer);
      for (let j = 0; j < 16; j++) w[j] = dv.getUint32(j * 4, true);
      let flags = 0;
      if (i === 0) flags |= CHUNK_START;
      if (i === numBlocks - 1) flags |= CHUNK_END | ROOT;
      const res = compress(cv, w, 0, rem, flags);
      cv = res.slice(0, 8);
    }
    const out = new Uint8Array(32);
    const odv = new DataView(out.buffer);
    for (let i = 0; i < 8; i++) odv.setUint32(i * 4, cv[i], true);
    return out;
  }
  return { hash };
})();

// ── Hex helpers ─────────────────────────────────────────────────────
function toHex(bytes) { return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(''); }
function fromHex(hex) {
  const clean = hex.replace(/^0x/, '');
  const out = new Uint8Array(clean.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(clean.substr(i*2, 2), 16);
  return out;
}

// ── Postcard varint encoding ────────────────────────────────────────
function encodeVarint(value) {
  const bytes = [];
  let v = BigInt(value);
  do { let byte = Number(v & 0x7Fn); v >>= 7n; if (v > 0n) byte |= 0x80; bytes.push(byte); } while (v > 0n);
  return new Uint8Array(bytes);
}

// ── Transaction signing ─────────────────────────────────────────────
const TX_DOMAIN = new TextEncoder().encode('AZTB_TX_V1');
const ENVELOPE_MAGIC = 0xAA;
const PREFIX_TRANSFER = 0x01;

function encodeTransferPayload(from32, to32, value, nonce, gasPrice) {
  const variantIdx = encodeVarint(0);
  const valEnc = encodeVarint(value);
  const nonceEnc = encodeVarint(nonce);
  const gasPriceEnc = encodeVarint(gasPrice);
  const enumPayload = new Uint8Array(variantIdx.length + 32 + 32 + valEnc.length + nonceEnc.length + gasPriceEnc.length);
  let off = 0;
  enumPayload.set(variantIdx, off); off += variantIdx.length;
  enumPayload.set(from32, off); off += 32;
  enumPayload.set(to32, off); off += 32;
  enumPayload.set(valEnc, off); off += valEnc.length;
  enumPayload.set(nonceEnc, off); off += nonceEnc.length;
  enumPayload.set(gasPriceEnc, off);
  const payload = new Uint8Array(1 + enumPayload.length);
  payload[0] = PREFIX_TRANSFER;
  payload.set(enumPayload, 1);
  return payload;
}

function signPayload(payload, keypair) {
  const msg = new Uint8Array(TX_DOMAIN.length + payload.length);
  msg.set(TX_DOMAIN);
  msg.set(payload, TX_DOMAIN.length);
  const sig = nacl.sign.detached(msg, keypair.secretKey);
  const payloadLen = payload.length;
  const buf = new Uint8Array(1 + 4 + payloadLen + 32 + 64);
  buf[0] = ENVELOPE_MAGIC;
  buf[1] = payloadLen & 0xFF;
  buf[2] = (payloadLen >> 8) & 0xFF;
  buf[3] = (payloadLen >> 16) & 0xFF;
  buf[4] = (payloadLen >> 24) & 0xFF;
  buf.set(payload, 5);
  buf.set(keypair.publicKey, 5 + payloadLen);
  buf.set(sig, 5 + payloadLen + 32);
  return buf;
}

function deriveAddress(publicKey) { return BLAKE3.hash(publicKey); }

// ── RPC ─────────────────────────────────────────────────────────────
async function rpc(method, rpcParams = []) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 4000);
  try {
    const res = await fetch(RPC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', method, params: rpcParams, id: 1 }),
      signal: controller.signal,
    });
    const json = await res.json();
    if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));
    return json.result;
  } finally { clearTimeout(timeout); }
}

async function fetchMetrics() {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 4000);
    const res = await fetch(RPC_URL.replace(/\/$/, '') + '/metrics/json', { signal: controller.signal });
    clearTimeout(timeout);
    cachedMetrics = await res.json();
  } catch (_) {}
  return cachedMetrics;
}

async function detectNodeType() {
  try {
    const info = await rpc('aztb_nodeInfo');
    if (info && info.nodeType) {
      APP_TITLE = info.nodeType === 'validator' ? 'Validator Dashboard' : 'Full Node';
      document.title = 'Aztibase ' + APP_TITLE;
      document.getElementById('app-title').textContent = APP_TITLE;
    }
  } catch (_) {}
}

// ── Helpers ─────────────────────────────────────────────────────────
function shortHash(h) {
  if (!h || h.length < 16) return h || '--';
  return h.slice(0, 10) + '\u2026' + h.slice(-6);
}
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function formatNumber(n) {
  if (n === undefined || n === null) return '--';
  return Number(n).toLocaleString();
}
function formatAZTB(raw) {
  const n = Number(raw || 0);
  if (n >= 1_000_000_000) return (n / 1_000_000_000).toFixed(2) + 'B';
  if (n >= 10_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 10_000) return (n / 1_000).toFixed(1) + 'K';
  return n.toLocaleString();
}
function isAddr(v) { return typeof v === 'string' && /^(0x)?[0-9a-fA-F]{64}$/.test(v); }
function timeAgo(ts) {
  if (!ts) return '--';
  const diff = Math.floor((Date.now() - ts * 1000) / 1000);
  if (diff < 5) return 'just now';
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}
function absTime(ts) {
  if (!ts) return '';
  return new Date(ts * 1000).toISOString().replace('T', ' ').replace(/\.\d+Z/, ' UTC');
}
function copyToClipboard(text, btnEl) {
  navigator.clipboard.writeText(text).then(() => {
    if (btnEl) {
      btnEl.textContent = '\u2713';
      btnEl.classList.add('copied');
      setTimeout(() => { btnEl.textContent = '\u2398'; btnEl.classList.remove('copied'); }, 1500);
    }
  }).catch(() => {});
}
function copyable(text) {
  const short = shortHash(text);
  const id = 'cp-' + Math.random().toString(36).slice(2, 8);
  return `<span class="mono" style="font-size:12px">${escapeHtml(short)}</span><button class="copy-btn" id="${id}" onclick="event.stopPropagation();copyToClipboard('${escapeHtml(text)}',document.getElementById('${id}'))" title="Copy">\u2398</button>`;
}
function copyableFull(text) {
  const id = 'cp-' + Math.random().toString(36).slice(2, 8);
  return `<span class="mono" style="font-size:12px">${escapeHtml(text)}</span><button class="copy-btn" id="${id}" onclick="event.stopPropagation();copyToClipboard('${escapeHtml(text)}',document.getElementById('${id}'))" title="Copy">\u2398</button>`;
}
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.style.opacity = '1');
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

// ── TX types ────────────────────────────────────────────────────────
const TX_TYPE_MAP = {
  0x01: ['Transfer', 'transfer'], 0x02: ['Deploy', 'contract'], 0x03: ['Call', 'contract'],
  0x04: ['EVM Deploy', 'contract'], 0x05: ['EVM Call', 'contract'],
  0x06: ['AI Infer', 'ai'], 0x07: ['Agent', 'ai'], 0x08: ['Model', 'ai'],
  0x09: ['Task', 'ai'], 0x0A: ['Attest', 'ai'], 0x0B: ['Compute', 'ai'],
  0x0C: ['Dereg', 'ai'], 0x0D: ['Dereg Model', 'ai'],
  0x0E: ['Proposal', 'governance'], 0x0F: ['Vote', 'governance'],
  0x10: ['Stake', 'staking'], 0x11: ['Unstake', 'staking'],
  0x12: ['Delegate', 'staking'], 0x13: ['Undelegate', 'staking'],
  0x14: ['Agent Policy', 'ai'], 0x15: ['Agent Exec', 'ai'],
  0x16: ['Anchor L2', 'bridge'], 0x17: ['Bridge In', 'bridge'],
  0x18: ['Bridge Out', 'bridge'], 0x19: ['Register L2', 'bridge'],
  0x1A: ['Key Rotate', 'security'], 0x1B: ['Faucet', 'transfer'],
};
const TX_NAME_TO_CLASS = {
  Transfer:'transfer', ContractDeploy:'contract', ContractCall:'contract',
  EvmDeploy:'contract', EvmCall:'contract', AiInfer:'ai', CreateAgent:'ai',
  RegisterModel:'ai', PostTask:'ai', SubmitAttestation:'ai', CommitCompute:'ai',
  DeregisterCompute:'ai', DeregisterModel:'ai', CreateProposal:'governance',
  CastVote:'governance', Stake:'staking', Unstake:'staking', Delegate:'staking',
  Undelegate:'staking', SetAgentPolicy:'ai', AgentExecute:'ai', AnchorL2State:'bridge',
  BridgeDeposit:'bridge', BridgeWithdraw:'bridge', RegisterL2:'bridge',
  RotateValidatorKey:'security', FaucetDrip:'transfer',
};

function txBadge(typeCode) {
  if (typeof typeCode === 'string' && TX_NAME_TO_CLASS[typeCode]) {
    const cls = TX_NAME_TO_CLASS[typeCode];
    const label = typeCode.replace(/([A-Z])/g, ' $1').trim();
    return `<span class="badge ${cls}">${label}</span>`;
  }
  const code = typeof typeCode === 'string' ? parseInt(typeCode, 16) : (typeCode || 0);
  const entry = TX_TYPE_MAP[code];
  if (!entry) return '<span class="badge unknown">Unknown</span>';
  return `<span class="badge ${entry[1]}">${entry[0]}</span>`;
}

function txTypeName(typeCode) {
  if (typeof typeCode === 'string' && TX_NAME_TO_CLASS[typeCode]) return typeCode.replace(/([A-Z])/g, ' $1').trim();
  const code = typeof typeCode === 'string' ? parseInt(typeCode, 16) : (typeCode || 0);
  const entry = TX_TYPE_MAP[code];
  return entry ? entry[0] : 'Unknown';
}

// ── Chart.js helpers ────────────────────────────────────────────────
const chartDefaults = {
  responsive: true,
  maintainAspectRatio: false,
  animation: { duration: 400 },
  plugins: { legend: { display: false }, tooltip: {
    backgroundColor: '#1a1720', borderColor: '#2e2a38', borderWidth: 1,
    titleColor: '#e8e4ec', bodyColor: 'rgba(232,228,236,0.72)', padding: 10,
    cornerRadius: 8, titleFont: { family: 'Inter', weight: 600 },
    bodyFont: { family: 'JetBrains Mono', size: 12 },
  }},
  scales: {
    x: { grid: { color: 'rgba(46,42,56,0.5)', drawBorder: false }, ticks: { color: 'rgba(232,228,236,0.35)', font: { family: 'Inter', size: 10 }, maxTicksLimit: 8 } },
    y: { grid: { color: 'rgba(46,42,56,0.5)', drawBorder: false }, ticks: { color: 'rgba(232,228,236,0.35)', font: { family: 'JetBrains Mono', size: 10 } }, beginAtZero: true },
  },
};

function makeGradient(ctx, color) {
  const g = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height);
  g.addColorStop(0, color + '40');
  g.addColorStop(1, color + '05');
  return g;
}

function createOrUpdateChart(id, labels, data, color, label) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  if (chartInstances[id]) {
    chartInstances[id].data.labels = labels;
    chartInstances[id].data.datasets[0].data = data;
    chartInstances[id].update('none');
    return;
  }

  chartInstances[id] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label,
        data,
        borderColor: color,
        backgroundColor: makeGradient(ctx, color),
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        pointHoverBackgroundColor: color,
        fill: true,
        tension: 0.35,
      }],
    },
    options: { ...chartDefaults },
  });
}

function createOrUpdateBarChart(id, labels, data, color, label) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  if (chartInstances[id]) {
    chartInstances[id].data.labels = labels;
    chartInstances[id].data.datasets[0].data = data;
    chartInstances[id].update('none');
    return;
  }

  chartInstances[id] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label,
        data,
        backgroundColor: color + '80',
        borderColor: color,
        borderWidth: 1,
        borderRadius: 4,
      }],
    },
    options: { ...chartDefaults, scales: {
      ...chartDefaults.scales,
      x: { ...chartDefaults.scales.x, grid: { display: false } },
    }},
  });
}

// ── Navigation ──────────────────────────────────────────────────────
function navigate(tab) {
  currentTab = tab;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  stopPolling();
  dashboardInitialized = false;
  Object.keys(chartInstances).forEach(k => { chartInstances[k].destroy(); delete chartInstances[k]; });

  if (tab === 'dashboard') showDashboard();
  else if (tab === 'blocks') { showBlocks(); pollTimer = setInterval(showBlocks, 3000); }
  else if (tab === 'transactions') { showTransactions(); pollTimer = setInterval(showTransactions, 4000); }
  else if (tab === 'validators') showValidators();
  else if (tab === 'wallet') showWallet();
}

function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function setActiveTab(tab) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  if (tab) document.getElementById('tab-' + tab).classList.add('active');
}

function setVal(id, value) {
  const el = document.getElementById(id);
  if (el && el.textContent !== String(value)) el.textContent = value;
}
function setValColor(id, value, color) {
  const el = document.getElementById(id);
  if (el) {
    if (el.textContent !== String(value)) el.textContent = value;
    el.style.color = color;
  }
}
function updateHeader(height, isConnected) {
  if (height != null) document.getElementById('hdr-height').textContent = formatNumber(height);
  const dot = document.getElementById('hdr-status');
  const text = document.getElementById('hdr-conn-text');
  dot.className = isConnected ? 'status-dot ok' : 'status-dot err';
  text.textContent = isConnected ? 'Connected' : 'Disconnected';
}

async function showDashboard() {
  if (requestInFlight) return;
  requestInFlight = true;
  const el = document.getElementById('content');

  if (!dashboardInitialized) {
    el.innerHTML = buildDashboardShell();
    dashboardInitialized = true;
  }

  try {
    const [height, gasPrice, metrics, healthData] = await Promise.all([
      rpc('aztb_blockNumber'),
      rpc('aztb_gasPrice').catch(() => null),
      fetchMetrics(),
      rpc('aztb_getChainHealth').catch(() => null),
    ]);

    const h = typeof height === 'string' ? parseInt(height, 16) : (height || 0);
    updateHeader(h, true);

    const m = metrics || {};
    const consensus = m.consensus || {};
    const execution = m.execution || {};
    const network = m.network || {};
    const staking = m.staking || {};

    setVal('d-height', formatNumber(h));
    setVal('d-peers', formatNumber(network.peer_count));
    setVal('d-validators', formatNumber(staking.active_validators));
    setVal('d-staked', formatAZTB(staking.total_staked));
    setVal('d-mempool', formatNumber(execution.mempool_size));
    setVal('d-latency', consensus.last_commit_latency_us ? (consensus.last_commit_latency_us / 1000).toFixed(0) + 'ms' : '--');
    setVal('d-basefee', gasPrice != null ? gasPrice : (execution.base_fee || '--'));
    setVal('d-commits', formatNumber(consensus.commits));

    const txNow = execution.txs_processed || 0;
    const now = Date.now();
    if (lastTxCount !== null && lastTxTime !== null) {
      const dt = (now - lastTxTime) / 1000;
      if (dt > 0) currentTps = ((txNow - lastTxCount) / dt).toFixed(1);
    }
    lastTxCount = txNow;
    lastTxTime = now;
    setVal('d-tps', currentTps);
    setVal('d-txs', formatNumber(txNow));

    setVal('d-vp', formatNumber(consensus.vertices_proposed));
    setVal('d-vr', formatNumber(consensus.vertices_received));
    setVal('d-rounds', formatNumber(consensus.rounds_advanced));
    setValColor('d-equiv', formatNumber(consensus.equivocations), consensus.equivocations > 0 ? 'var(--red)' : 'inherit');
    setValColor('d-slashes', formatNumber(staking.slashes_applied), staking.slashes_applied > 0 ? 'var(--red)' : 'inherit');
    setVal('d-pending', formatNumber(execution.pending_tasks));

    // TPS history for chart
    tpsHistory.push(parseFloat(currentTps) || 0);
    if (tpsHistory.length > 30) tpsHistory.shift();
    const tpsLabels = tpsHistory.map((_, i) => '');
    createOrUpdateChart('chart-tps', tpsLabels, tpsHistory, '#6ba89e', 'TPS');

    // Sentinel panel
    if (healthData) {
      const score = healthData.score ?? healthData.health_score ?? 0;
      const level = healthData.level ?? healthData.health_level ?? 'normal';
      const panel = document.getElementById('sentinel-panel');
      if (panel) {
        const levelColor = level === 'critical' ? 'var(--red)' : level === 'warning' ? 'var(--yellow)' : 'var(--green)';
        const levelBg = level === 'critical' ? 'var(--red-soft)' : level === 'warning' ? 'var(--yellow-soft)' : 'var(--green-soft)';
        panel.innerHTML = `<div class="card" style="margin-bottom:24px;padding:16px 18px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <span style="font-size:13px;font-weight:700;color:var(--text-secondary)">AI Sentinel Health</span>
            <span class="badge ${level === 'critical' ? 'security' : level === 'warning' ? 'bridge' : 'governance'}">${level}</span>
          </div>
          <div class="health-bar"><div class="fill ${level}" style="width:${score}%"></div></div>
          <div style="display:flex;justify-content:space-between;margin-top:6px">
            <span style="font-size:11px;color:var(--text-muted);font-family:var(--mono)">${score}/100</span>
            <span style="font-size:11px;color:${levelColor};font-weight:600">${level === 'normal' ? 'All systems nominal' : level === 'warning' ? 'Anomalies detected' : 'Action required'}</span>
          </div>
        </div>`;
      }
    }

    // Blocks + tx volume chart
    if (h > 0) {
      const from = Math.max(0, h - 19);
      const blocks = await rpc('aztb_getBlockRange', [from, h]);
      const container = document.getElementById('dash-blocks');
      if (blocks && blocks.length > 0) {
        const txCounts = blocks.map(b => b.transactions ? b.transactions.length : (b.tx_count || b.txCount || 0));
        const blockLabels = blocks.map(b => {
          const num = typeof b.number === 'string' ? parseInt(b.number, 16) : b.number;
          return '#' + num;
        });
        createOrUpdateBarChart('chart-txvol', blockLabels, txCounts, '#8878a6', 'Transactions');

        const displayBlocks = blocks.slice(-8).reverse();
        container.innerHTML = displayBlocks.map(b => {
          const num = typeof b.number === 'string' ? parseInt(b.number, 16) : b.number;
          const txCount = b.transactions ? b.transactions.length : (b.tx_count || b.txCount || 0);
          const ts = b.timestamp;
          return `<div class="block-row" onclick="showBlock(${num})">
            <div class="block-icon">B</div>
            <div class="block-info">
              <div class="block-num">#${num}</div>
              <div class="block-hash">${b.hash || '--'}</div>
            </div>
            <div class="block-meta-right">
              <div class="block-txcount">${txCount} tx${txCount !== 1 ? 's' : ''}</div>
              <div class="block-age" ${ts ? `title="${absTime(ts)}"` : ''}>${ts ? timeAgo(ts) : '--'}</div>
            </div>
          </div>`;
        }).join('');
      }
    }

    if (!pollTimer) pollTimer = setInterval(refreshDashboard, 5000);

  } catch (e) {
    if (!dashboardInitialized) {
      el.innerHTML = `<div class="empty-state">Failed to connect to node at ${escapeHtml(RPC_URL)}<br><br>${escapeHtml(e.message)}<br><br>Use ?rpc=http://host:port to set endpoint</div>`;
      updateHeader(null, false);
    }
    if (!pollTimer) pollTimer = setInterval(refreshDashboard, 5000);
  }
  requestInFlight = false;
}

async function refreshDashboard() {
  if (currentTab !== 'dashboard') return;
  try { await showDashboard(); } catch (_) {}
}

  }
  try {
    const height = await rpc('aztb_blockNumber');
    const h = typeof height === 'string' ? parseInt(height, 16) : (height || 0);
    updateHeader(h, true);
    if (h === 0) { document.getElementById('blocks-list').innerHTML = '<div class="empty-state">No blocks yet</div>'; return; }

    const from = Math.max(0, h - 29);
    const rangeBlocks = await rpc('aztb_getBlockRange', [from, h]);
    const list = document.getElementById('blocks-list');
    if (!rangeBlocks || rangeBlocks.length === 0) { list.innerHTML = '<div class="empty-state">No blocks</div>'; return; }

      <thead><tr><th>Block</th><th>Hash</th><th>Txns</th><th>Age</th></tr></thead>
      <tbody>${rangeBlocks.reverse().map(b => {
        const num = typeof b.number === 'string' ? parseInt(b.number, 16) : b.number;
        const txCount = b.transactions ? new Set(b.transactions).size : (b.tx_count || b.txCount || 0);
        const hash = b.hash || '--';
        const ts = b.timestamp;
        return `<tr onclick="showBlock(${num})">
          <td><span style="color:var(--accent);font-weight:700;font-family:var(--mono)">#${num}</span></td>
          <td><span class="mono" style="font-size:11px;color:var(--text-muted)">${shortHash(hash)}</span></td>
          <td><span class="badge transfer">${txCount} tx${txCount !== 1 ? 's' : ''}</span></td>
          <td style="color:var(--text-muted)" ${ts ? `title="${absTime(ts)}"` : ''}>${ts ? timeAgo(ts) : '--'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="empty-state">Failed: ${escapeHtml(e.message)}</div>`;
    updateHeader(null, false);
  }
}

async function showBlock(num) {
  stopPolling();
  setActiveTab(null);
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty-state">Loading block...</div>';

  try {
    const block = await rpc('aztb_getBlockByNumber', [num]);
    if (!block) {
      el.innerHTML = `<a class="nav-link" onclick="navigate('blocks')">Back to blocks</a><div class="empty-state">Block #${num} not found</div>`;
      return;
    }

    const txs = [...new Set(block.transactions || [])];
    const hash = block.hash || '--';
    const stateRoot = block.stateRoot || block.state_root || '--';
    const parentHash = block.parentHash || block.parent_hash || '--';
    const ts = block.timestamp;

    const prevBtn = num > 0 ? `<button class="btn btn-ghost btn-sm" onclick="showBlock(${num - 1})">\u2190 #${num-1}</button>` : '';
    const nextBtn = `<button class="btn btn-ghost btn-sm" onclick="showBlock(${num + 1})">#${num+1} \u2192</button>`;

    el.innerHTML = `
      <a class="nav-link" onclick="navigate('blocks')">Back to blocks</a>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <div style="font-size:20px;font-weight:800">Block #${num}</div>
        <div style="display:flex;gap:6px">${prevBtn} ${nextBtn}</div>
      </div>
      <div class="card" style="margin-bottom:20px">
        <div class="card-row" style="cursor:default"><div class="card-label" data-tooltip="Unique block identifier">Block Hash</div><div class="card-value">${copyableFull(hash)}</div></div>
        <div class="card-row" style="cursor:default"><div class="card-label">Height</div><div class="card-value" style="font-weight:700">${formatNumber(num)}</div></div>
        <div class="card-row" style="cursor:default"><div class="card-label" data-tooltip="Hash of the previous block">Parent Hash</div><div class="card-value">${copyableFull(parentHash)}</div></div>
        <div class="card-row" style="cursor:default"><div class="card-label" data-tooltip="Root hash of Verkle state tree">State Root</div><div class="card-value">${copyableFull(stateRoot)}</div></div>
        <div class="card-row" style="cursor:default"><div class="card-label">Timestamp</div><div class="card-value">${ts ? `<span title="${absTime(ts)}">${timeAgo(ts)}</span> <span style="color:var(--text-muted);font-size:11px">(${absTime(ts)})</span>` : '--'}</div></div>
        <div class="card-row" style="cursor:default"><div class="card-label">Transactions</div><div class="card-value"><span class="badge transfer">${txs.length} transaction${txs.length !== 1 ? 's' : ''}</span></div></div>
      </div>
      ${txs.length > 0 ? `
        <div class="section-hdr"><div class="section-title">Transactions in Block</div></div>
        <div class="card"><table class="data-table">
          <thead><tr><th>#</th><th>Transaction Hash</th></tr></thead>
          <tbody>${txs.map((tx, i) => `<tr onclick="showTx('${escapeHtml(tx)}')">
            <td style="color:var(--text-muted);font-family:var(--mono);width:40px">${i}</td>
            <td>${copyable(tx)}</td>
          </tr>`).join('')}</tbody>
        </table></div>` : ''}`;
  } catch (e) {
    el.innerHTML = `<a class="nav-link" onclick="navigate('blocks')">Back to blocks</a><div class="empty-state">Error: ${escapeHtml(e.message)}</div>`;
  }
}

// ══════════════════════════════════════════════════════════════════
// TRANSACTIONS
// ══════════════════════════════════════════════════════════════════

async function showTransactions() {
  const el = document.getElementById('content');
  if (!document.getElementById('tx-table')) {
    el.innerHTML = `<div class="section-hdr"><div class="section-title">Recent Transactions <span class="live-dot"></span></div></div><div id="tx-table"><div class="empty-state">Loading...</div></div>`;
  }

  try {
    const height = await rpc('aztb_blockNumber');
    const h = typeof height === 'string' ? parseInt(height, 16) : (height || 0);
    updateHeader(h, true);
    if (h === 0) { document.getElementById('tx-table').innerHTML = '<div class="empty-state">No blocks yet</div>'; return; }

    const from = Math.max(0, h - 50);
    const blocks = await rpc('aztb_getBlockRange', [from, h]);
    if (!blocks || blocks.length === 0) { document.getElementById('tx-table').innerHTML = '<div class="empty-state">No blocks</div>'; return; }

    const txRows = [];
    const seenHashes = new Set();
    for (const b of blocks.reverse()) {
      const num = typeof b.number === 'string' ? parseInt(b.number, 16) : b.number;
      let txHashes = [];
      try {
        const full = await rpc('aztb_getBlockByNumber', [num]);
        txHashes = [...new Set((full && full.transactions) || [])];
      } catch (_) {}
      for (const txHash of txHashes) {
        if (seenHashes.has(txHash)) continue;
        seenHashes.add(txHash);
        try {
          const tx = await rpc('aztb_getTransactionByHash', [txHash]);
          if (tx) {
            const receipt = tx.receipt || {};
            txRows.push({ hash: txHash, block: num, type: tx.type || tx.tx_type || tx.kind || 0,
              from: tx.from || tx.sender || '--', to: tx.to || tx.recipient || '--',
              value: tx.value || 0, gas: receipt.gasUsed || tx.gas_used || tx.gas_limit || '--',
              status: receipt.success != null ? (receipt.success ? 1 : 0) : (tx.status != null ? tx.status : null),
              timestamp: b.timestamp,
            });
          }
        } catch (_) {}
        if (txRows.length >= 50) break;
      }
      if (txRows.length >= 50) break;
    }

    const container = document.getElementById('tx-table');
    if (txRows.length === 0) { container.innerHTML = '<div class="empty-state">No transactions in recent blocks</div>'; return; }

    container.innerHTML = `<div class="card"><table class="data-table">
      <thead><tr><th>Hash</th><th>Type</th><th>Block</th><th>From</th><th>To</th><th>Value</th><th>Fee</th><th>Status</th></tr></thead>
      <tbody>${txRows.map(tx => {
        const statusHtml = tx.status === 1 || tx.status === '1' || tx.status === true
          ? '<span class="status-ok">Success</span>'
          : tx.status === 0 || tx.status === '0' || tx.status === false
          ? '<span class="status-fail">Failed</span>'
          : '<span style="color:var(--text-muted)">--</span>';
        return `<tr onclick="showTx('${escapeHtml(tx.hash)}')">
          <td>${copyable(tx.hash)}</td>
          <td>${txBadge(tx.type)}</td>
          <td><a onclick="event.stopPropagation();showBlock(${tx.block})" style="font-family:var(--mono)">#${tx.block}</a></td>
          <td>${isAddr(tx.from) ? `<a onclick="event.stopPropagation();showAccount('${escapeHtml(tx.from)}')">${shortHash(tx.from)}</a>` : escapeHtml(String(tx.from))}</td>
          <td>${isAddr(tx.to) ? `<a onclick="event.stopPropagation();showAccount('${escapeHtml(tx.to)}')">${shortHash(tx.to)}</a>` : escapeHtml(String(tx.to))}</td>
          <td style="font-family:var(--mono)">${formatNumber(tx.value)}</td>
          <td style="font-family:var(--mono);color:var(--text-muted)">${tx.gas !== '--' ? formatNumber(tx.gas) : '--'}</td>
          <td>${statusHtml}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="empty-state">Failed: ${escapeHtml(e.message)}</div>`;
    updateHeader(null, false);
  }
}

async function showTx(hash) {
  stopPolling();
  setActiveTab(null);
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty-state">Loading transaction...</div>';

  try {
    const tx = await rpc('aztb_getTransactionByHash', [hash]);
    if (!tx) {
      el.innerHTML = `<a class="nav-link" onclick="navigate('dashboard')">Back</a><div class="empty-state">Transaction not found</div>`;
      return;
    }

    const txType = tx.type || tx.tx_type || tx.kind || 0;
    const receipt = tx.receipt || {};
    const status = receipt.success != null ? receipt.success : (tx.status != null ? tx.status : null);
    const statusHtml = status === true || status === 1 || status === '1'
      ? '<span class="status-ok">Success</span>'
      : status === false || status === 0 || status === '0'
      ? '<span class="status-fail">Failed</span>'
      : '<span style="color:var(--text-muted)">Pending</span>';

    const mainFields = ['hash', 'type', 'tx_type', 'kind', 'receipt'];
    const extraFields = Object.entries(tx).filter(([k]) => !mainFields.includes(k) && !['from', 'sender', 'to', 'recipient', 'value', 'nonce', 'gas_price', 'gas_limit', 'gas_used', 'block_number'].includes(k));
    const sender = tx.from || tx.sender || '--';
    const recipient = tx.to || tx.recipient || '--';

    el.innerHTML = `
      <a class="nav-link" onclick="navigate('dashboard')">Back</a>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <div style="font-size:20px;font-weight:800">Transaction Details</div>
        ${txBadge(txType)}
      </div>
      <div class="card">
        <div class="card-row" style="cursor:default"><div class="card-label" data-tooltip="Unique transaction identifier">Transaction Hash</div><div class="card-value">${copyableFull(hash)}</div></div>
        <div class="card-row" style="cursor:default"><div class="card-label">Status</div><div class="card-value">${statusHtml}</div></div>
        <div class="card-row" style="cursor:default"><div class="card-label">Type</div><div class="card-value">${txBadge(txType)} <span style="color:var(--text-secondary);margin-left:6px">${escapeHtml(txTypeName(txType))}</span></div></div>
        <div class="card-row" style="cursor:default"><div class="card-label" data-tooltip="Account that signed this transaction">From</div><div class="card-value">${isAddr(sender) ? `<a onclick="showAccount('${escapeHtml(sender)}')">${copyableFull(sender)}</a>` : escapeHtml(String(sender))}</div></div>
        <div class="card-row" style="cursor:default"><div class="card-label" data-tooltip="Destination account or contract">To</div><div class="card-value">${isAddr(recipient) ? `<a onclick="showAccount('${escapeHtml(recipient)}')">${copyableFull(recipient)}</a>` : escapeHtml(String(recipient))}</div></div>
        <div class="card-row" style="cursor:default"><div class="card-label">Value</div><div class="card-value" style="font-weight:700">${formatNumber(tx.value || 0)} AZTB</div></div>
        ${tx.nonce != null ? `<div class="card-row" style="cursor:default"><div class="card-label" data-tooltip="Sequential number for sender">Nonce</div><div class="card-value">${tx.nonce}</div></div>` : ''}
        ${tx.block_number != null ? `<div class="card-row" style="cursor:default"><div class="card-label">Block</div><div class="card-value"><a onclick="showBlock(${tx.block_number})" style="font-weight:600">#${tx.block_number}</a></div></div>` : ''}
        ${receipt.gasUsed != null ? `<div class="card-row" style="cursor:default"><div class="card-label" data-tooltip="Gas consumed by execution">Gas Used</div><div class="card-value" style="font-family:var(--mono)">${formatNumber(receipt.gasUsed)}</div></div>` : ''}
        ${tx.gas_price != null ? `<div class="card-row" style="cursor:default"><div class="card-label">Gas Price</div><div class="card-value" style="font-family:var(--mono)">${tx.gas_price}</div></div>` : ''}
        ${extraFields.length > 0 ? `
          <div class="collapsible-toggle" onclick="toggleCollapsible(this)"><span class="arrow">\u25B6</span> More Details (${extraFields.length} fields)</div>
          <div class="collapsible-body">
            ${extraFields.map(([k, v]) => `<div class="card-row" style="cursor:default">
              <div class="card-label">${escapeHtml(k)}</div>
              <div class="card-value">${typeof v === 'object' ? `<code style="font-size:11px;color:var(--text-muted)">${escapeHtml(JSON.stringify(v))}</code>` : isAddr(String(v)) ? `<a onclick="showAccount('${escapeHtml(String(v))}')">${copyableFull(String(v))}</a>` : escapeHtml(String(v))}</div>
            </div>`).join('')}
          </div>` : ''}
      </div>`;
  } catch (e) {
    el.innerHTML = `<a class="nav-link" onclick="navigate('dashboard')">Back</a><div class="empty-state">Error: ${escapeHtml(e.message)}</div>`;
  }
}

function toggleCollapsible(el) {
  el.classList.toggle('open');
  const body = el.nextElementSibling;
  if (body) body.classList.toggle('open');
}

// ══════════════════════════════════════════════════════════════════
// VALIDATORS
// ══════════════════════════════════════════════════════════════════

async function showValidators() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty-state">Loading validators...</div>';

  try {
    const [validators, metrics, emissionInfo, epochRewards] = await Promise.all([
      rpc('aztb_getActiveValidators').catch(() => []),
      fetchMetrics(),
      rpc('aztb_getEmissionInfo').catch(() => null),
      rpc('aztb_getEpochRewards', [5]).catch(() => []),
    ]);

    const staking = (metrics || {}).staking || {};
    const ei = emissionInfo || {};

    if (lastKnownEpoch >= 0 && ei.current_epoch > lastKnownEpoch) {
      showToast(`Epoch ${ei.current_epoch - 1} complete \u2014 rewards distributed`);
    }
    if (ei.current_epoch != null) lastKnownEpoch = ei.current_epoch;

    const lastRewards = {};
    let totalRewardsThisEpoch = 0;
    if (Array.isArray(epochRewards) && epochRewards.length > 0) {
      const latest = epochRewards[epochRewards.length - 1];
      (latest.credits || []).forEach(c => {
        lastRewards[c.validator] = Number(c.amount);
        totalRewardsThisEpoch += Number(c.amount);
      });
    }

    const balances = {};
    if (Array.isArray(validators) && validators.length > 0) {
      const balResults = await Promise.all(validators.map(v => {
        const addr = v.validator_id || v.address || (typeof v === 'string' ? v : '');
        const hexAddr = typeof addr === 'string' && addr.startsWith('0x') ? addr : '0x' + addr;
        return rpc('aztb_getBalance', [hexAddr]).then(b => [addr, b]).catch(() => [addr, null]);
      }));
      for (const [addr, bal] of balResults) {
        if (bal != null) balances[addr] = typeof bal === 'string' ? parseInt(bal, 16) : Number(bal);
      }
    }

    let tableRows = '';
    if (Array.isArray(validators) && validators.length > 0) {
      tableRows = validators.map((v, i) => {
        const addr = v.validator_id || v.address || (typeof v === 'string' ? v : JSON.stringify(v));
        const addrStr = typeof addr === 'string' ? addr : '';
        const addrLookup = addrStr.startsWith('0x') ? addrStr : '0x' + addrStr;
        const stake = v.effective_stake != null ? formatAZTB(v.effective_stake) : (v.stake != null ? formatAZTB(v.stake) : '--');
        const bal = balances[addr] != null ? formatAZTB(balances[addr]) : '--';
        const reward = lastRewards[addrLookup] != null ? formatAZTB(lastRewards[addrLookup]) : (lastRewards[addrStr] != null ? formatAZTB(lastRewards[addrStr]) : '--');
        const status = v.active !== false ? '<span class="status-ok">Active</span>' : '<span class="status-fail">Inactive</span>';
        return `<tr onclick="showAccount('${escapeHtml(addrStr)}')">
          <td style="font-weight:700;color:var(--text-muted)">${i + 1}</td>
          <td><a onclick="event.stopPropagation();showAccount('${escapeHtml(addrStr)}')">${shortHash(addrStr || JSON.stringify(addr))}</a></td>
          <td style="font-family:var(--mono)">${bal}</td>
          <td style="font-family:var(--mono);font-weight:600">${stake}</td>
          <td style="font-family:var(--mono);color:var(--green-text)">${reward}</td>
          <td>${status}</td>
        </tr>`;
      }).join('');
    } else {
      tableRows = '<tr><td colspan="6" class="empty-state">No validator data</td></tr>';
    }

    const epochProgress = ei.epoch_length ? Math.round(((ei.rounds_in_current_epoch || 0) / ei.epoch_length) * 100) : 0;
    const roundsLeft = ei.rounds_until_next_epoch != null ? formatNumber(ei.rounds_until_next_epoch) : '--';

    el.innerHTML = `
      <div class="stats-grid" style="margin-bottom:24px">
        <div class="stat-card"><div class="icon orange">&#9733;</div><div class="val">${formatNumber(staking.active_validators || (Array.isArray(validators) ? validators.length : '--'))}</div><div class="label">Active Validators</div></div>
        <div class="stat-card"><div class="icon blue">&#8962;</div><div class="val">${formatAZTB(staking.total_staked)}</div><div class="label">Total Staked</div></div>
        <div class="stat-card"><div class="icon purple">&#9830;</div><div class="val">${formatNumber(ei.current_epoch != null ? ei.current_epoch : '--')}</div><div class="label">Current Epoch</div></div>
        <div class="stat-card"><div class="icon cyan">&#9679;</div><div class="val">${roundsLeft}</div><div class="label">Next Epoch In</div></div>
      </div>
      <div class="card" style="margin-bottom:24px;padding:16px 18px">
        <div style="display:flex;justify-content:space-between;margin-bottom:10px">
          <span style="font-size:13px;font-weight:700;color:var(--text-secondary)">Epoch Progress</span>
          <span style="font-size:12px;font-family:var(--mono);color:var(--text-muted)">${ei.rounds_in_current_epoch || 0} / ${ei.epoch_length || '--'} rounds</span>
        </div>
        <div class="progress-bar"><div class="fill" style="width:${epochProgress}%;background:var(--accent)"></div></div>
        ${totalRewardsThisEpoch > 0 ? `<div style="color:var(--green-text);font-size:12px;margin-top:8px;font-weight:600">Last epoch distributed ${formatAZTB(totalRewardsThisEpoch)} AZTB</div>` : ''}
      </div>
      <div class="section-hdr"><div class="section-title">Validator Set</div></div>
      <div class="card"><table class="data-table">
        <thead><tr><th>#</th><th>Address</th><th>Balance</th><th>Stake</th><th>Last Reward</th><th>Status</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty-state">Error: ${escapeHtml(e.message)}</div>`;
  }
}

async function showAccount(addr) {
  stopPolling();
  setActiveTab(null);
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty-state">Loading account...</div>';

  try {
    const [balance, nonce, accType, stake, delegation] = await Promise.all([
      rpc('aztb_getBalance', [addr]).catch(() => '0'),
      rpc('aztb_getNonce', [addr]).catch(() => '0'),
      rpc('aztb_getAccountType', [addr]).catch(() => 'Unknown'),
      rpc('aztb_getValidatorStake', [addr]).catch(() => null),
      rpc('aztb_getDelegation', [addr]).catch(() => null),
    ]);

    const bal = typeof balance === 'string' ? balance : String(balance || 0);
    let stakingHtml = '';
    if (stake != null && stake !== '0' && stake !== 0) {
      stakingHtml = `<div class="card-row" style="cursor:default"><div class="card-label" data-tooltip="Amount staked as validator">Validator Stake</div><div class="card-value" style="font-weight:700;color:var(--cyan)">${formatAZTB(stake)} AZTB</div></div>`;
    }
    if (delegation != null && typeof delegation === 'object') {
      stakingHtml += `<div class="card-row" style="cursor:default"><div class="card-label">Delegation</div><div class="card-value"><code style="font-size:11px">${escapeHtml(JSON.stringify(delegation))}</code></div></div>`;
    }

    const typeBadge = accType === 'validator' ? '<span class="badge staking">Validator</span>'
      : accType === 'delegator' ? '<span class="badge staking">Delegator</span>'
      : accType === 'contract' ? '<span class="badge contract">Contract</span>'
      : '';

    el.innerHTML = `
      <a class="nav-link" onclick="navigate('dashboard')">Back</a>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <div style="font-size:20px;font-weight:800">Account</div>
        ${typeBadge}
      </div>
      <div class="card" style="margin-bottom:24px">
        <div class="card-row" style="cursor:default"><div class="card-label">Address</div><div class="card-value">${copyableFull(addr)}</div></div>
        <div class="card-row" style="cursor:default"><div class="card-label" data-tooltip="Current AZTB balance">Balance</div><div class="card-value" style="font-weight:800;font-size:16px;color:var(--text)">${formatNumber(bal)} AZTB</div></div>
        <div class="card-row" style="cursor:default"><div class="card-label" data-tooltip="Transactions sent from this account">Nonce</div><div class="card-value">${escapeHtml(String(nonce))}</div></div>
        <div class="card-row" style="cursor:default"><div class="card-label">Type</div><div class="card-value">${escapeHtml(String(accType))} ${typeBadge}</div></div>
        ${stakingHtml}
      </div>
      <div class="section-hdr"><div class="section-title">Recent Transactions</div></div>
      <div id="account-txs"><div class="empty-state">Scanning recent blocks...</div></div>`;
    loadAccountTxs(addr);
  } catch (e) {
    el.innerHTML = `<a class="nav-link" onclick="navigate('dashboard')">Back</a><div class="empty-state">Error: ${escapeHtml(e.message)}</div>`;
  }
}

async function loadAccountTxs(addr) {
  const container = document.getElementById('account-txs');
  if (!container) return;
  try {
    const height = await rpc('aztb_blockNumber');
    const h = typeof height === 'string' ? parseInt(height, 16) : (height || 0);
    if (h === 0) { container.innerHTML = '<div class="empty-state">No blocks yet</div>'; return; }

    const from = Math.max(0, h - 50);
    const blocks = await rpc('aztb_getBlockRange', [from, h]);
    const found = [];
    for (const b of (blocks || []).reverse()) {
      const num = typeof b.number === 'string' ? parseInt(b.number, 16) : b.number;
      let txHashes = [];
      try { const full = await rpc('aztb_getBlockByNumber', [num]); txHashes = (full && full.transactions) || []; } catch (_) {}
      for (const txHash of txHashes) {
        try {
          const tx = await rpc('aztb_getTransactionByHash', [txHash]);
          if (!tx) continue;
          const sender = tx.from || tx.sender || '';
          const recip = tx.to || tx.recipient || '';
          if (sender === addr || recip === addr) {
            found.push({ hash: txHash, block: num, type: tx.type || tx.tx_type || tx.kind || 0,
              from: sender, to: recip, value: tx.value || 0 });
          }
        } catch (_) {}
        if (found.length >= 25) break;
      }
      if (found.length >= 25) break;
    }

    if (found.length === 0) { container.innerHTML = '<div class="empty-state">No transactions found in recent blocks</div>'; return; }

    container.innerHTML = `<div class="card"><table class="data-table">
      <thead><tr><th>Hash</th><th>Type</th><th>Block</th><th>Direction</th><th>Counterparty</th><th>Value</th></tr></thead>
      <tbody>${found.map(tx => {
        const isOut = tx.from === addr;
        const dir = isOut ? '<span class="dir-out">OUT</span>' : '<span class="dir-in">IN</span>';
        const other = isOut ? tx.to : tx.from;
        return `<tr onclick="showTx('${escapeHtml(tx.hash)}')">
          <td>${copyable(tx.hash)}</td>
          <td>${txBadge(tx.type)}</td>
          <td><a onclick="event.stopPropagation();showBlock(${tx.block})" style="font-family:var(--mono)">#${tx.block}</a></td>
          <td>${dir}</td>
          <td>${isAddr(other) ? `<a onclick="event.stopPropagation();showAccount('${escapeHtml(other)}')">${shortHash(other)}</a>` : escapeHtml(String(other))}</td>
          <td style="font-family:var(--mono)">${formatNumber(tx.value)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
  } catch (e) {
    container.innerHTML = `<div class="empty-state">Error: ${escapeHtml(e.message)}</div>`;
  }
}

function showWallet() {
  const el = document.getElementById('content');
  const isConn = walletKeypair !== null || extensionConnected;
  const isExt = extensionConnected;
  const extAvailable = hasExtension();

  el.innerHTML = `
    <div class="section-hdr"><div class="section-title">Wallet ${isConn ? (isExt ? '<span class="badge governance">Extension</span>' : '<span class="badge governance">Connected</span>') : '<span class="badge unknown">Not Connected</span>'}</div></div>
    <div class="wallet-grid">
      <div>
        <div class="wallet-section">
          <h3>Connect Wallet</h3>
          ${isConn ? `
            <div class="card" style="margin-bottom:12px">
              <div class="card-row" style="cursor:default"><div class="card-label">Address</div><div class="card-value" style="color:var(--accent);font-size:11px;font-family:var(--mono)">${walletAddress}</div></div>
              ${isExt ? `<div class="card-row" style="cursor:default"><div class="card-label">Source</div><div class="card-value" style="color:var(--green-text);font-weight:600">Aztibase Extension</div></div>`
              : `<div class="card-row" style="cursor:default"><div class="card-label">Secret Key</div><div class="card-value"><span id="secret-display" class="mono" style="font-size:11px">${'*'.repeat(64)}</span><span class="secret-toggle" onclick="toggleSecret()">show</span></div></div>
              <div class="card-row" style="cursor:default"><div class="card-label">Public Key</div><div class="card-value mono" style="font-size:11px">${walletKeypair ? toHex(walletKeypair.publicKey) : '--'}</div></div>`}
              <div class="card-row" style="cursor:default"><div class="card-label">Balance</div><div class="card-value" id="wallet-balance" style="font-weight:700;font-size:16px">loading...</div></div>
              <div class="card-row" style="cursor:default"><div class="card-label">Nonce</div><div class="card-value" id="wallet-nonce">--</div></div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn btn-ghost" onclick="refreshWalletBalance()">Refresh</button>
              <button class="btn btn-green" onclick="walletFaucetDrip()">Faucet (1M AZTB)</button>
              <button class="btn btn-red" onclick="disconnectWallet()">Disconnect</button>
            </div>
          ` : `
            ${extAvailable ? `<button class="btn btn-green" onclick="connectExtension()" style="margin-bottom:12px;width:100%">Connect Aztibase Extension</button>
            <div style="color:var(--text-muted);font-size:11px;margin-bottom:14px;text-align:center;font-weight:600">\u2014 or connect manually \u2014</div>` : ''}
            <div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn btn-primary" onclick="generateNewWallet()">Generate Keypair</button></div>
            <div>
              <div style="color:var(--text-muted);font-size:11px;margin-bottom:6px;font-weight:600">Import secret key (64 hex chars):</div>
              <input class="wallet-input" id="import-secret" placeholder="Enter 64-character hex secret key..." maxlength="66" spellcheck="false" autocomplete="off">
              <button class="btn btn-secondary" onclick="importWallet()">Import</button>
            </div>
          `}
          <div id="wallet-status"></div>
        </div>
      </div>
      <div>
        ${isConn ? `
        <div class="wallet-section">
          <h3>Send Transfer</h3>
          <input class="wallet-input" id="send-to" placeholder="Recipient address (64 hex chars)" maxlength="66" spellcheck="false">
          <input class="wallet-input" id="send-amount" placeholder="Amount (AZTB)" type="number" min="1">
          <input class="wallet-input" id="send-gas" placeholder="Gas price (default: 1)" type="number" min="1" value="1">
          <button class="btn btn-primary" onclick="sendTransfer()">Sign & Send</button>
          <div id="send-status"></div>
        </div>
        <div class="wallet-section">
          <h3>Transaction Log</h3>
          <div id="tx-log" class="card"><div class="empty-state" style="padding:20px">No transactions yet</div></div>
        </div>` : `
        <div class="wallet-section">
          <h3>Getting Started</h3>
          <div class="card">
            ${extAvailable ? `<div class="card-row" style="flex-direction:column;gap:6px;cursor:default"><div style="font-weight:700">1. Connect extension</div><div style="color:var(--text-muted);font-size:12px">Click "Connect Aztibase Extension" above.</div></div>`
            : `<div class="card-row" style="flex-direction:column;gap:6px;cursor:default"><div style="font-weight:700">1. Generate or import keypair</div><div style="color:var(--text-muted);font-size:12px">Create a fresh Ed25519 key or paste an existing secret key.</div></div>`}
            <div class="card-row" style="flex-direction:column;gap:6px;cursor:default"><div style="font-weight:700">2. Get testnet tokens</div><div style="color:var(--text-muted);font-size:12px">Use Faucet to receive 1,000,000 AZTB.</div></div>
            <div class="card-row" style="flex-direction:column;gap:6px;cursor:default"><div style="font-weight:700">3. Send a transfer</div><div style="color:var(--text-muted);font-size:12px">Enter recipient and amount, then sign & broadcast.</div></div>
          </div>
        </div>`}
      </div>
    </div>`;
  if (isConn) refreshWalletBalance();
}

function walletStatus(msg, cls) { const el = document.getElementById('wallet-status'); if (el) el.innerHTML = `<div class="wallet-alert ${cls}">${escapeHtml(msg)}</div>`; }
function sendStatus(msg, cls) { const el = document.getElementById('send-status'); if (el) el.innerHTML = `<div class="wallet-alert ${cls}">${escapeHtml(msg)}</div>`; }

async function connectExtension() {
  if (!hasExtension()) { walletStatus('Extension not detected.', 'error'); return; }
  try {
    walletStatus('Connecting...', 'info');
    const result = await window.aztibase.connect();
    if (result?.address) {
      walletAddress = result.address; walletKeypair = null; walletSecretHex = null; extensionConnected = true;
      showWallet();
      walletStatus(result.locked ? 'Extension locked. Unlock to sign.' : 'Connected via extension.', result.locked ? 'warn' : 'success');
    } else { walletStatus('No wallet found.', 'error'); }
  } catch (e) { walletStatus('Failed: ' + e.message, 'error'); }
}

function generateNewWallet() { walletFromSeed(nacl.randomBytes(32)); showWallet(); walletStatus('New keypair generated. Save your secret key!', 'success'); }

function importWallet() {
  const hex = (document.getElementById('import-secret').value || '').trim().replace(/^0x/, '');
  if (!/^[0-9a-fA-F]{64}$/.test(hex)) { walletStatus('Invalid key. Must be 64 hex characters.', 'error'); return; }
  walletFromSeed(fromHex(hex)); showWallet(); walletStatus('Wallet imported.', 'success');
}

function disconnectWallet() {
  walletKeypair = null; walletAddress = null; walletSecretHex = null; extensionConnected = false; txLog = [];
  if (hasExtension()) window.aztibase.disconnect().catch(() => {});
  showWallet();
}

function toggleSecret() {
  secretVisible = !secretVisible;
  const el = document.getElementById('secret-display');
  const toggle = el?.nextElementSibling;
  if (el) el.textContent = secretVisible ? walletSecretHex : '*'.repeat(64);
  if (toggle) toggle.textContent = secretVisible ? 'hide' : 'show';
}

async function refreshWalletBalance() {
  if (!walletAddress) return;
  try {
    if (extensionConnected && hasExtension()) {
      const result = await window.aztibase.getBalance();
      const balEl = document.getElementById('wallet-balance');
      const nonceEl = document.getElementById('wallet-nonce');
      if (balEl) balEl.textContent = formatNumber(result.balance) + ' AZTB';
      if (nonceEl) nonceEl.textContent = String(result.nonce);
    } else {
      const [balance, nonce] = await Promise.all([rpc('aztb_getBalance', [walletAddress]), rpc('aztb_getNonce', [walletAddress])]);
      const balEl = document.getElementById('wallet-balance');
      const nonceEl = document.getElementById('wallet-nonce');
      if (balEl) balEl.textContent = formatNumber(balance) + ' AZTB';
      if (nonceEl) nonceEl.textContent = String(nonce);
    }
  } catch (e) { const balEl = document.getElementById('wallet-balance'); if (balEl) balEl.textContent = 'error'; }
}

async function walletFaucetDrip() {
  if (!walletAddress) return;
  walletStatus('Requesting faucet...', 'info');
  try {
    let result;
    if (extensionConnected && hasExtension()) { result = await window.aztibase.faucetDrip(); }
    else { result = await rpc('aztb_faucetDrip', [walletAddress]); }
    walletStatus('Faucet drip sent!', 'success');
    addTxLog('Faucet Drip', '1,000,000 AZTB', result?.address || result || 'sent');
    setTimeout(refreshWalletBalance, 2000);
  } catch (e) { walletStatus('Faucet error: ' + e.message, 'error'); }
}

async function sendTransfer() {
  const isConn = walletKeypair !== null || extensionConnected;
  if (!isConn) return;
  const toHexVal = (document.getElementById('send-to').value || '').trim().replace(/^0x/, '');
  const amountStr = (document.getElementById('send-amount').value || '').trim();
  const gasPriceStr = (document.getElementById('send-gas').value || '1').trim();

  if (!/^[0-9a-fA-F]{64}$/.test(toHexVal)) { sendStatus('Invalid recipient address.', 'error'); return; }
  const amount = parseInt(amountStr, 10);
  if (!amount || amount <= 0) { sendStatus('Invalid amount.', 'error'); return; }
  const gasPrice = parseInt(gasPriceStr, 10) || 1;

  if (extensionConnected && hasExtension()) {
    sendStatus('Signing via extension...', 'info');
    try {
      const result = await window.aztibase.signAndSendTransfer(toHexVal, amount, gasPrice);
      const txHash = result?.txHash || result || 'submitted';
      sendStatus('Sent! Hash: ' + txHash, 'success');
      addTxLog('Transfer ' + amount + ' AZTB', 'to ' + toHexVal.slice(0, 12) + '...', txHash);
      setTimeout(refreshWalletBalance, 3000);
    } catch (e) { sendStatus('Error: ' + e.message, 'error'); }
    return;
  }

  sendStatus('Fetching nonce...', 'info');
  try {
    const nonce = await rpc('aztb_getNonce', [walletAddress]);
    const from32 = deriveAddress(walletKeypair.publicKey);
    const to32 = fromHex(toHexVal);
    sendStatus('Signing...', 'info');
    const payload = encodeTransferPayload(from32, to32, amount, nonce, gasPrice);
    const envelope = signPayload(payload, walletKeypair);
    sendStatus('Broadcasting...', 'info');
    const result = await rpc('aztb_sendRawTransaction', [toHex(envelope)]);
    const txHash = result?.tx_hash || result || 'submitted';
    sendStatus('Sent! Hash: ' + txHash, 'success');
    addTxLog('Transfer ' + amount + ' AZTB', 'to ' + toHexVal.slice(0, 12) + '...', txHash);
    setTimeout(refreshWalletBalance, 3000);
  } catch (e) { sendStatus('Error: ' + e.message, 'error'); }
}

function addTxLog(title, detail, hash) {
  txLog.unshift({ title, detail, hash, time: new Date().toLocaleTimeString() });
  if (txLog.length > 20) txLog.pop();
  renderTxLog();
}

function renderTxLog() {
  const el = document.getElementById('tx-log');
  if (!el || txLog.length === 0) return;
  el.innerHTML = txLog.map(tx => `
    <div class="card-row" style="cursor:default">
      <div style="flex:1"><div style="font-size:12px;font-weight:600">${escapeHtml(tx.title)}</div><div style="font-size:11px;color:var(--text-muted)">${escapeHtml(tx.detail)}</div></div>
      <div style="text-align:right"><div style="font-size:11px;color:var(--text-muted)">${escapeHtml(tx.time)}</div><div style="font-family:var(--mono);font-size:10px;color:var(--text-muted)">${typeof tx.hash === 'string' ? escapeHtml(tx.hash.slice(0, 16)) + '...' : '--'}</div></div>
    </div>`).join('');
}

// SEARCH
// ══════════════════════════════════════════════════════════════════

function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  if (/^\d+$/.test(q)) { showBlock(parseInt(q, 10)); }
  else if (/^0x[0-9a-fA-F]+$/.test(q) || /^[0-9a-fA-F]{64}$/.test(q)) {
    if (q.replace('0x', '').length === 64) {
      rpc('aztb_getTransactionByHash', [q]).then(tx => {
        if (tx) showTx(q); else showAccount(q.replace(/^0x/, ''));
      }).catch(() => showAccount(q.replace(/^0x/, '')));
    } else { showBlock(parseInt(q, 16)); }
  } else { showAccount(q); }
}

document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

// ══════════════════════════════════════════════════════════════════
// CONNECTION GATE
// ══════════════════════════════════════════════════════════════════

function showConnectGate(errorMsg) {
  document.querySelector('header').style.display = 'none';
  document.querySelector('.search-wrap').style.display = 'none';
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="connect-gate">
      <div class="logo-big"><span class="dot"></span>Aztibase <em>${APP_TITLE}</em></div>
      <div class="subtitle">${isPublic ? 'Explore the Aztibase Network' : 'Connect to an Aztibase node'}</div>
      <div class="rpc-form">
        <input id="gate-rpc" value="${escapeHtml(RPC_URL)}" placeholder="http://host:port" spellcheck="false">
        <button onclick="tryConnect()">Connect</button>
      </div>
      <div class="status-msg ${errorMsg ? 'err' : ''}" id="gate-status">${errorMsg ? escapeHtml(errorMsg) : ''}</div>
      <div style="color:var(--text-muted);font-size:12px;max-width:400px">
        Enter the RPC endpoint of any Aztibase node. Default is localhost:9944 for local testnet.
        You can also pass <code style="color:var(--accent)">?rpc=http://host:port</code> in the URL.
      </div>
    </div>`;
  document.getElementById('gate-rpc').addEventListener('keydown', e => { if (e.key === 'Enter') tryConnect(); });
}

async function tryConnect() {
  const input = document.getElementById('gate-rpc');
  const status = document.getElementById('gate-status');
  const url = (input.value || '').trim();
  if (!url) { status.textContent = 'Enter an RPC URL'; status.className = 'status-msg err'; return; }
  RPC_URL = url;
  status.textContent = 'Connecting...';
  status.className = 'status-msg trying';
  try {
    const chainId = await rpc('aztb_chainId');
    status.textContent = 'Connected! Chain ID: ' + (chainId || 'unknown');
    status.className = 'status-msg ok';
    connected = true;
    document.getElementById('hdr-chain').textContent = chainId || '--';
    if (!isPublic) detectNodeType();
    setTimeout(() => {
      document.querySelector('header').style.display = '';
      document.querySelector('.search-wrap').style.display = '';
      navigate('dashboard');
    }, 400);
  } catch (e) {
    status.textContent = 'Failed: ' + e.message;
    status.className = 'status-msg err';
  }
}

// ══════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════

(async () => {
  try {
    const chainId = await rpc('aztb_chainId');
    document.getElementById('hdr-chain').textContent = chainId || '--';
    connected = true;
    if (!isPublic) detectNodeType();
    navigate('dashboard');
  } catch (_) {
    showConnectGate('Could not connect to ' + RPC_URL);
  }
})();
