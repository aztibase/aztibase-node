data_dir = "/var/lib/aztibase"
genesis_path = "/etc/aztibase/genesis.toml"
validator_key = "/etc/aztibase/keys/validator.json"
profile = "testnet"
archive = false

[network]
listen_addresses = [
    "/ip4/0.0.0.0/tcp/30333",
    "/ip4/0.0.0.0/udp/30333/quic-v1",
]
boot_nodes = [
    "/dns4/testnet2.aztibase.com/tcp/30333",
    "/dns4/testnet3.aztibase.com/tcp/30333",
]
idle_timeout_secs = 120
stun_servers = [
    "stun:stun.l.google.com:19302",
    "stun:stun1.l.google.com:19302",
]
enable_webrtc = false
webrtc_listen_port = 9000

[rpc]
listen_addr = "0.0.0.0:9944"
enabled = true
rate_limit_per_ip = 100
max_body_bytes = 1048576
cors_allowed_origins = []

[log]
level = "info"

[ai]
enabled = false
models = []

[metrics]
enabled = true
