<!DOCTYPE html>
<html>
<head>
<style>
html { background: #4A3B8F; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #4A3B8F;
}
.content { text-align: center; }
h1 { color: #FFFFFF; font-size: 28pt; font-weight: 300; letter-spacing: 3pt; margin: 0 0 6pt 0; }
h2 { color: #C4B8E0; font-size: 14pt; font-weight: 300; letter-spacing: 1.5pt; margin: 0 0 24pt 0; }
.divider { width: 60pt; height: 1pt; margin: 0 auto 24pt auto; }
.divider div { width: 100%; height: 1pt; background: #8B7FB0; }
.info { margin-bottom: 6pt; }
.info p { color: #D4C8F0; font-size: 10pt; font-weight: 300; margin: 0; letter-spacing: 0.5pt; }
.demo { margin-top: 20pt; padding: 10pt 20pt; border-radius: 4pt; }
.demo div { background: rgba(255,255,255,0.1); border-radius: 4pt; padding: 10pt 20pt; }
.demo p { color: #FFFFFF; font-size: 9pt; font-family: Courier New, monospace; margin: 0; }
.contact { margin-top: 20pt; }
.contact p { color: #8B7FB0; font-size: 8pt; margin: 0; letter-spacing: 1pt; }
</style>
</head>
<body>
<div class="content">
  <h1>AZTIBASE NETWORK</h1>
  <h2>The blockchain that works for a living</h2>
  <div class="divider"><div></div></div>
  <div class="info"><p>aztibase.com</p></div>
  <div class="info"><p>@aztibase</p></div>
  <div class="info"><p>[CONTACT TO BE CONFIRMED]</p></div>
  <div class="demo"><div>
    <p>Run our testnet: bash start-testnet.sh</p>
  </div></div>
  <div class="contact">
    <p>CODE AVAILABLE FOR TECHNICAL DUE DILIGENCE</p>
  </div>
</div>
</body>
</html>
