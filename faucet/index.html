<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aztibase Testnet Faucet</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

header {
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}
.logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
.logo span { color: var(--accent); }
nav { display: flex; gap: 16px; font-size: 14px; }

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
}
.faucet-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 40px;
  max-width: 520px;
  width: 100%;
}
.faucet-card h1 {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 8px;
}
.faucet-card .subtitle {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 28px;
}
.field-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  margin-bottom: 6px;
}
.address-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.address-input:focus { border-color: var(--accent); }
.address-input::placeholder { color: #484f58; }

.drip-btn {
  width: 100%;
  margin-top: 16px;
  padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.drip-btn:hover { opacity: 0.9; }
.drip-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.result {
  margin-top: 20px;
  padding: 14px;
  border-radius: 8px;
  font-size: 13px;
  font-family: var(--mono);
  word-break: break-all;
  display: none;
}
.result.success { display: block; background: #0d2818; border: 1px solid #1a7f37; color: var(--green); }
.result.error { display: block; background: #2d1117; border: 1px solid #6e3630; color: var(--red); }
.result.loading { display: block; background: #2b1d11; border: 1px solid #6e5a30; color: var(--yellow); }

.info-row {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}
.info-item { font-size: 13px; }
.info-item .label { color: var(--muted); }
.info-item .val { color: var(--text); font-family: var(--mono); font-size: 12px; }

footer {
  border-top: 1px solid var(--border);
  padding: 16px 24px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
}
</style>
</head>
<body>

<header>
  <div class="logo">Aztibase <span>Faucet</span></div>
  <nav>
    <a href="https://testnet.aztibase.com">Testnet</a>
    <a href="https://explorer.aztibase.com">Explorer</a>
    <a href="https://aztibase.com">Home</a>
  </nav>
</header>

<main>
  <div class="faucet-card">
    <h1>Testnet Faucet</h1>
    <p class="subtitle">Get 10 AZTB testnet tokens. Rate limited to 1 request per 60 seconds per address.</p>

    <div class="field-label">Your wallet address</div>
    <input
      type="text"
      class="address-input"
      id="addressInput"
      placeholder="Enter your hex address (64 characters)"
      maxlength="66"
      spellcheck="false"
      autocomplete="off"
    >

    <button class="drip-btn" id="dripBtn" onclick="requestDrip()">
      Request 10 AZTB
    </button>

    <div class="result" id="result"></div>

    <div class="info-row">
      <div class="info-item">
        <span class="label">Network:</span>
        <span class="val">Aztibase Testnet</span>
      </div>
      <div class="info-item">
        <span class="label">Chain ID:</span>
        <span class="val">0xA27B</span>
      </div>
      <div class="info-item">
        <span class="label">Amount:</span>
        <span class="val">10 AZTB</span>
      </div>
      <div class="info-item">
        <span class="label">Cooldown:</span>
        <span class="val">60s</span>
      </div>
    </div>
  </div>
</main>

<footer>
  Aztibase Network &mdash; AI-Native Layer 1 Blockchain
</footer>

<script>
const RPC_URL = new URLSearchParams(window.location.search).get('rpc') || 'http://localhost:9944';

function setResult(msg, cls) {
  const el = document.getElementById('result');
  el.textContent = msg;
  el.className = 'result ' + cls;
}

async function requestDrip() {
  const addr = document.getElementById('addressInput').value.trim().replace(/^0x/, '');
  if (!/^[0-9a-fA-F]{64}$/.test(addr)) {
    setResult('Invalid address. Enter a 64-character hex address.', 'error');
    return;
  }

  const btn = document.getElementById('dripBtn');
  btn.disabled = true;
  btn.textContent = 'Requesting...';
  setResult('Sending faucet request...', 'loading');

  try {
    const resp = await fetch(RPC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0',
        method: 'aztb_faucetDrip',
        params: [addr],
        id: 1
      })
    });

    const data = await resp.json();

    if (data.error) {
      setResult('Error: ' + data.error.message, 'error');
    } else if (data.result) {
      const txHash = data.result.tx_hash || data.result;
      setResult('Success! Sent 10 AZTB. Tx: ' + txHash, 'success');
    } else {
      setResult('Sent! Check your balance in a few seconds.', 'success');
    }
  } catch (err) {
    setResult('Network error: ' + err.message + '. Is the RPC node running?', 'error');
  } finally {
    btn.textContent = 'Request 10 AZTB';
    setTimeout(() => { btn.disabled = false; }, 60000);
    startCooldown(60);
  }
}

function startCooldown(seconds) {
  const btn = document.getElementById('dripBtn');
  let remaining = seconds;
  const interval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(interval);
      btn.textContent = 'Request 10 AZTB';
      btn.disabled = false;
    } else {
      btn.textContent = 'Wait ' + remaining + 's';
    }
  }, 1000);
}

document.getElementById('addressInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') requestDrip();
});
</script>
</body>
</html>
