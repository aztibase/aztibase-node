[workspace]
resolver = "2"
members = [
    "crates/aztibase-core",
    "crates/aztibase-network",
    "crates/aztibase-storage",
    "crates/aztibase-consensus",
    "crates/aztibase-execution",
    "crates/aztibase-runtime",
    "crates/aztibase-rpc",
    "crates/aztibase-node",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aztibase-network/aztibase"
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
aztibase-core = { path = "crates/aztibase-core" }
aztibase-network = { path = "crates/aztibase-network" }
aztibase-storage = { path = "crates/aztibase-storage" }
aztibase-consensus = { path = "crates/aztibase-consensus" }
aztibase-execution = { path = "crates/aztibase-execution" }
aztibase-runtime = { path = "crates/aztibase-runtime" }
aztibase-rpc = { path = "crates/aztibase-rpc" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
prost = "0.13"
prost-build = "0.13"

# Crypto
blake3 = "1"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
blst = "0.3"
rand = "0.8"

# P2P networking
libp2p = { version = "0.54", features = [
    "tokio",
    "noise",
    "tcp",
    "quic",
    "gossipsub",
    "kad",
    "mdns",
    "identify",
    "ping",
    "dns",
    "yamux",
    "macros",
    "serde",
] }

# Storage (redb: pure Rust, no native deps; rocksdb to be added later with LLVM)
redb = "2"

# AI inference
tract-onnx = "0.21"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# WASM execution
wasmtime = "28"

# EVM execution (no default C deps — precompiles added separately)
revm = { version = "36", default-features = false, features = ["std"] }

# HTTP / RPC
axum = "0.8"

# Async utilities
futures = "0.3"

# Misc
bytes = "1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
directories = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
