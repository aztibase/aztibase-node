[workspace]
resolver = "2"
members = [
    "crates/aztibase-core",
    "crates/aztibase-network",
    "crates/aztibase-storage",
    "crates/aztibase-consensus",
    "crates/aztibase-execution",
    "crates/aztibase-runtime",
    "crates/aztibase-rpc",
    "crates/aztibase-node",
    "crates/aztibase-wasm",
]
exclude = [
    "crates/aztibase-core/fuzz",
    "crates/aztibase-consensus/fuzz",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aztibase-network/aztibase"
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
aztibase-core = { path = "crates/aztibase-core" }
aztibase-network = { path = "crates/aztibase-network" }
aztibase-storage = { path = "crates/aztibase-storage" }
aztibase-consensus = { path = "crates/aztibase-consensus" }
aztibase-execution = { path = "crates/aztibase-execution" }
aztibase-runtime = { path = "crates/aztibase-runtime" }
aztibase-rpc = { path = "crates/aztibase-rpc" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
prost = "0.13"
prost-build = "0.13"

# Crypto
blake3 = "1"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
blst = "0.3"
rand = "0.8"
bip39 = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }

# P2P networking
libp2p = { version = "0.54", features = [
    "tokio",
    "noise",
    "tcp",
    "quic",
    "gossipsub",
    "kad",
    "mdns",
    "identify",
    "ping",
    "dns",
    "yamux",
    "macros",
    "serde",
    "request-response",
    "autonat",
    "relay",
    "dcutr",
] }

# Storage (redb: pure Rust, no native deps; rocksdb to be added later with LLVM)
redb = "2"

# AI inference
tract-onnx = "0.21"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# WASM execution
wasmtime = "42"

# EVM execution (no default C deps — precompiles added separately)
revm = { version = "36", default-features = false, features = ["std"] }

# HTTP / RPC
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Metrics
prometheus-client = "0.23"

# Async utilities
futures = "0.3"

# Parallelism
rayon = "1.10"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Async utilities
async-trait = "0.1"

# WASM
wasm-bindgen = "0.2"
js-sys = "0.3"

# HTTP middleware
tower-http = { version = "0.6", features = ["cors"] }

# Misc
bytes = "1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
directories = "6"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
